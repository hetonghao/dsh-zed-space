<style>
  /* 宇宙皮肤：整屏 WebGL2 画布，首帧渲染完成前保持纯黑，完成后再淡入 */

  body > canvas { opacity: 0; transition: opacity .6s ease; }

  @media (prefers-reduced-motion: reduce) { body > canvas { transition: none; } }
</style>
