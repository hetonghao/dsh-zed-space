<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>原型透明背景</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <script>
      // 原插件空视频库回退到 ocean；原型仅应答就绪，不启动渲染器。
      addEventListener("message", (event) => {
        if (
          event.source !== parent ||
          event.origin !== location.origin ||
          event.data?.type !== "bs-prepare"
        )
          return;
        parent.postMessage(
          {
            type: "bs-frame-ready",
            surface: "ocean",
            requestId: event.data.requestId,
          },
          location.origin,
        );
      });
    </script>
  </body>
</html>
