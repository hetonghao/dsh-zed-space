name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Chrome for Testing
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Chrome for Testing
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Ensure video test tools
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: npm run check
      - run: npm run package:extension
      - name: Browser acceptance
        run: xvfb-run -a npm run test:browser
      - name: Website acceptance
        run: BACKSPACE_HEADLESS=1 npm run test:website
      - name: Desktop glass regression
        run: BACKSPACE_HEADLESS=1 npm run test:desktop
