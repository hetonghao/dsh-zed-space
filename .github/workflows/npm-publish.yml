name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag whose package version should be published
        required: true

permissions:
  contents: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: release-tooling
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Refuse historical package identity
        run: node -e 'if (require("./package.json").name !== "dsh-zed-space") process.exit(1)'
      - run: npm ci
      - name: Prepare browser and video checks
        run: |
          npx playwright install --with-deps chromium
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
          gh release view "$RELEASE_TAG"
      - run: npm run build && npm run check
      - name: Pack once and publish those exact bytes
        run: |
          mkdir -p release-audit
          npm pack --ignore-scripts --pack-destination release-audit --json > release-audit/pack.json
          node -e 'const fs=require("fs"); const p=require("./release-audit/pack.json")[0]; fs.copyFileSync("release-audit/"+p.filename,"release-audit/dsh-zed-space.tgz")'
          npm publish ./release-audit/dsh-zed-space.tgz --ignore-scripts --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify registry bytes before attaching GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          npm view "dsh-zed-space@$VERSION" dist --json --registry=https://registry.npmjs.org > release-audit/dist.json
          URL=$(node -p 'require("./release-audit/dist.json").tarball')
          curl --fail --location --retry 5 "$URL" -o release-audit/registry.tgz
          node release-tooling/scripts/verify-release.mjs release-audit/dsh-zed-space.tgz release-audit/registry.tgz release-audit/dist.json
          (cd release-audit && sha256sum "dsh-zed-space-$VERSION.tgz" dsh-zed-space.tgz > SHA256SUMS)
          gh release upload "$RELEASE_TAG" "release-audit/dsh-zed-space-$VERSION.tgz" release-audit/dsh-zed-space.tgz release-audit/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-integrity-evidence
          path: release-audit/
